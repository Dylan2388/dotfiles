onboarding = false
[theme]
name = "tokyo-night"
auto_switch = false

[keys]
# Select/focus an agent by index directly: ctrl+1..9 focuses agent row 1..9 (no prefix)
focus_agent = "ctrl+1..9"
# Optional: cycle through agents without an index
previous_agent = "prefix+["
next_agent = "prefix+]"

# Rename the agent in the currently focused pane.
# There is no built-in rename_agent action, so this is a custom command.
[[keys.command]]
key = "prefix+shift+a"
type = "popup"
command = "/home/ephahoa/.config/herdr/scripts/rename-current-agent.sh"
width = "70%"
height = "30%"

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"
[experimental]
pane_history = false
