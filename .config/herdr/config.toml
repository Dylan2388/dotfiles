onboarding = false
[theme]
name = "tokyo-night"
auto_switch = false

[keys]
# Select/focus an agent by index directly: ctrl+1..9 focuses agent row 1..9 (no prefix)
focus_agent = "ctrl+1..9"
# Optional: cycle through agents without an index
previous_agent = "prefix+["
next_agent = "prefix+]"

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"
[experimental]
kitty_graphics = true
pane_history = false

# Plugin manager
[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"

# Hunkdiff plugin
[[keys.command]]
key = "prefix+alt+h"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review"
description = "hunk: review changes"

[[keys.command]]
key = "prefix+alt+s"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.send-review"
description = "hunk: send review to agent"

[[keys.command]]
key = "prefix+alt+a"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:staged"
description = "hunk: review staged changes"

[[keys.command]]
key = "prefix+alt+b"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:branch"
description = "hunk: review this branch against its base"

[[keys.command]]
key = "prefix+alt+c"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:commit"
description = "hunk: review the last commit"

[[keys.command]]
key = "prefix+alt+t"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:stash"
description = "hunk: review the most recent stash entry"

[[keys.command]]
key = "prefix+alt+r"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.reload"
description = "hunk: reload the open review"

[[keys.command]]
key = "prefix+alt+x"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.close-review"
description = "hunk: close the review pane"

[[keys.command]]
key = "prefix+alt+n"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.next-comment"
description = "hunk: go to the next review comment"

[[keys.command]]
key = "prefix+alt+p"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.prev-comment"
description = "hunk: go to the previous review comment"

# herdr-lazygit plugin
[[keys.command]]              # lazygit: open in a split
key = "prefix+g"
type = "plugin_action"
command = "herdr-lazygit.open"

[[keys.command]]              # lazygit: open in its own tab
key = "prefix+shift+g"
type = "plugin_action"
command = "herdr-lazygit.open-tab"

# Herdr-annotate plugin
# Terminal annotations
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy annotations as context and archive them"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

# Document review (plannotator-tui)
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"

# Herdr nvim
[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+shift+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

# vim-herdr-navigation — ctrl+h/j/k/l cross Vim splits and herdr panes.
# The action forwards the key into the pane when its foreground process is
# Vim/Neovim, otherwise it moves herdr's pane focus.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# herdr-navigator — one fuzzy index over workspaces, agents, sessions, roots.
# prefix+t shadows herdr's built-in prefix+t; prefix+shift+t shadows its shift pair.
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+shift+t"
type = "plugin_action"
command = "herdr-navigator.open-side"
description = "navigator side pane"

# Jump Back toggles current/previous workspace. Bound to prefix+shift+b rather
# than the README's prefix+l, which is herdr's focus-pane-right and the way out
# of a non-Vim pane now that ctrl+l is navigation.
[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "herdr-navigator.jump-back"
description = "jump to previous workspace"
