onboarding = false
[theme]
name = "tokyo-night"
auto_switch = false

[keys]
# Select/focus an agent by index directly: ctrl+1..9 focuses agent row 1..9 (no prefix)
focus_agent = "ctrl+1..9"
# Optional: cycle through agents without an index
previous_agent = "prefix+["
next_agent = "prefix+]"

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true

[experimental]
pane_history = false
